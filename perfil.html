<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Rare Nexus</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <style>
        body{
            background:#0d0d0d;
            color:#fff;
            font-family:Arial,Helvetica,sans-serif;
            margin:0;
        }

        .perfil{
            max-width:500px;
            margin:50px auto;
            background:#181818;
            border-radius:15px;
            padding:30px;
            text-align:center;
        }

        .perfil img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:3px solid #d4af37;
            margin-bottom:20px;
        }

        h1{
            color:#d4af37;
        }

        p{
            font-size:18px;
        }

        button{
            margin-top:20px;
            padding:12px 25px;
            border:none;
            border-radius:8px;
            background:#d4af37;
            color:#000;
            font-size:16px;
            cursor:pointer;
        }

        .perfil-menu{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.perfil-menu a{
    display:flex;
    align-items:center;
    gap:12px;
    background:#222;
    padding:15px;
    border-radius:10px;
    text-decoration:none;
    color:#fff;
    border:1px solid #333;
}

.perfil-menu i{
    width:22px;
    color:#d4af37;
}

.perfil-menu{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.perfil-menu a{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 18px;
    background:#222;
    color:#fff;
    text-decoration:none;
    border-radius:10px;
    border:1px solid #2d2d2d;
    transition:.25s;
}

.perfil-menu a:hover{
    background:#d4af37;
    color:#000;
    transform:translateX(5px);
}

.perfil-info{
    margin:20px 0;
}

.info-item{
    background:#222;
    border:1px solid #333;
    border-radius:10px;
    padding:15px;
}

.info-item span{
    display:block;
    font-size:13px;
    color:#a8a8a8;
    margin-bottom:6px;
}

.info-item strong{
    font-size:18px;
    color:#d4af37;
}

.btn-primary{
    display:block;
    width:100%;
    margin:20px 0;
    padding:14px;
    background:#d4af37;
    color:#000;
    text-decoration:none;
    border-radius:10px;
    font-weight:bold;
    text-align:center;
}

.btn-primary:hover{
    opacity:.9;
}
        
    </style>
</head>

<body>

<div class="perfil">

    <img src="assets/logo.png" alt="Rare Nexus">

    <h1>Meu Perfil</h1>

    <p id="userName">Utilizador</p>

<p><strong>E-mail:</strong></p>
<p id="email">Carregando...</p>

    <div class="perfil-info">

    <div class="info-item">
        <span>Status</span>
        <strong>Membro Rare Nexus</strong>
    </div>

</div>

<a href="editar-perfil.html" class="btn-primary">
    Editar Perfil
</a>

<div class="perfil-menu">

    <a href="favoritos.html">
        <i class="fa-regular fa-heart"></i>
        <span>Favoritos</span>
    </a>

    <a href="carrinho.html">
        <i class="fa-solid fa-cart-shopping"></i>
        <span>Carrinho</span>
    </a>

    <a href="pedidos.html">
        <i class="fa-solid fa-box"></i>
        <span>Meus Pedidos</span>
    </a>

    <a href="enderecos.html">
        <i class="fa-solid fa-location-dot"></i>
        <span>Endereços</span>
    </a>

    <a href="configuracoes.html">
        <i class="fa-solid fa-gear"></i>
        <span>Configurações</span>
    </a>

</div>

<button id="logoutBtn">Sair</button>

</div>

<script type="module">
import { auth } from "./js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const email = document.getElementById("email");

onAuthStateChanged(auth, (user) => {

    if (user) {
        email.textContent = user.email;

document.getElementById("userName").textContent =
    user.displayName || "Utilizador";
    } else {
        window.location = "login.html";
    }

});

document.getElementById("logoutBtn").onclick = () => {

    signOut(auth).then(() => {
        window.location = "login.html";
    });

};
</script>

</body>
</html>
