<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Rare Nexus</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="login-container">

    <img src="assets/logo.png" alt="Rare Nexus" class="login-logo">

    <h1>Criar Conta</h1>

    <form id="cadastroForm">

        <input
            type="text"
            id="nome"
            placeholder="Nome completo"
            required>

        <input
            type="email"
            id="email"
            placeholder="E-mail"
            required>

        <input
    type="password"
    id="senha"
    placeholder="Senha"
    required>

<input
    type="password"
    id="confirmarSenha"
    placeholder="Confirmar senha"
    required>

<button type="submit">
    Criar Conta
</button>

    </form>

    <p>
        Já possui uma conta?
        <a href="login.html">Entrar</a>
    </p>

</main>

<script type="module" src="js/cadastro.js"></script>

</body>
</html>
